# Keeps the Supabase project from being paused.
#
# Supabase pauses free-tier projects that see no activity for 7 days. The
# weekly catalog update writes to the database only once a week, which is
# too close to that line, so every 3 days this runs one tiny read through
# the public REST API.
#
# The URL and key are the same public ones that site/index.html already
# ships. Never put the secret key (SUPABASE_SECRET) in this file.
#
# Note: GitHub turns off scheduled workflows in a repo with no commits for
# 60 days; the weekly update commits every week, so that won't happen here.

name: Supabase keep-alive

on:
  schedule:
    - cron: "41 7 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query the database
        env:
          SUPABASE_URL: https://prnfnqvjirwuyafvsulk.supabase.co
          SUPABASE_KEY: sb_publishable_mxaPvh6JxrmWlaOuR4LVkA_q0ll9ESM
        run: |
          # `titles` is the catalog table the site reads. Only the apikey
          # header: sb_publishable_ keys are not JWTs.
          status=$(curl -sS -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/titles?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY")
          echo "Supabase answered HTTP $status"
          [ "$status" -lt 400 ]
