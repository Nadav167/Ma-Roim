<style>
/* Layout: media-center shell. Fixed icon rail (bottom bar on phones), sticky search bar,
   a featured hero, then horizontally scrolling poster shelves. Dark by design. */
:root {
  --bg: #0e0c18;          /* violet-tinted night */
  --surface: #181527;
  --surface-2: #231f37;
  --line: #2e2947;
  --fg: #eceaf6;
  --muted: #9a96b5;
  --accent: #8b6dff;      /* the one violet */
  --accent-ink: #ffffff;
  --gold: #f2c94c;        /* ratings */
  --ok: #4fd1a5;          /* watched */
  --font-ui: "Figtree", "Rubik", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-he: "Rubik", "Figtree", system-ui, "Segoe UI", "Arial Hebrew", sans-serif;
  --rail: 76px;
  --poster: 150px;
  color-scheme: dark;
}
html[lang="he"] { --font-ui: var(--font-he); }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); -webkit-text-size-adjust: 100%; }
body { margin: 0; }
img { max-width: 100%; }
html, body { background: var(--bg); color: var(--fg); }
/* the page never moves sideways on a phone; rows of posters still scroll on their own */
/* (html's setting goes to the window itself; body uses clip, which unlike hidden doesn't make body its own scroll area and keeps the top bar pinned) */
html { overflow-x: hidden; overscroll-behavior-x: none; }
body { max-width: 100%; overflow-x: clip; }
/* iPhone zooms in on text fields under 16px, which lets the page slide sideways */
@media (max-width: 720px) { input, textarea, select { font-size: 16px !important; } }
body {
  font-family: var(--font-ui); font-size: 15px; line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

/* ---------- rail ---------- */
.rail {
  position: fixed; inset-block: 0; inset-inline-start: 0; width: var(--rail); z-index: 20;
  background: var(--surface); border-inline-end: 1px solid var(--line);
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  padding-block: calc(14px + env(safe-area-inset-top, 0px)) 14px;
}
.brand { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center;
  background: var(--accent); color: var(--accent-ink); font-weight: 800; font-size: 15px; margin-block-end: 14px; letter-spacing: -.02em; overflow: hidden; }
.brand img { width: 100%; height: 100%; display: block; }
.nav-btn { width: 60px; padding-block: 9px 7px; border: 0; background: none; border-radius: 12px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--muted); font-size: 11px; font-weight: 600; }
.nav-btn svg { width: 22px; height: 22px; }
.nav-btn:hover { color: var(--fg); background: var(--surface-2); }
.nav-btn[aria-current="page"] { color: var(--fg); background: var(--surface-2); }
.nav-btn[aria-current="page"] svg { color: var(--accent); }

/* ---------- top bar ---------- */
.app { margin-inline-start: var(--rail); min-width: 0; }
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 15;
  display: flex; align-items: center; gap: 14px;
  padding-block: 14px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px));
  background: linear-gradient(var(--bg) 60%, transparent);
}
.wordmark { font-weight: 800; font-size: 19px; letter-spacing: -.02em; white-space: nowrap; }
.wordmark span { color: var(--accent); }
.search { flex: 1; max-width: 560px; margin-inline: auto; position: relative; min-width: 0; }
.search input { width: 100%; height: 44px; border-radius: 22px; border: 1px solid var(--line); background: var(--surface);
  padding-inline: 44px 16px; outline: none; }
.search input::placeholder { color: var(--muted); }
.suggest { position: absolute; top: calc(100% + 6px); inset-inline: 0; z-index: 25; background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
  box-shadow: 0 18px 44px rgba(0,0,0,.55); padding: 6px; display: grid; gap: 2px; max-height: min(70vh, 560px); overflow-y: auto; }
.suggest h3 { margin: 6px 10px 2px; font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
html[lang="he"] .suggest h3 { letter-spacing: 0; }
.sg { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 12px; align-items: center; padding: 6px 8px; border-radius: 10px; border: 0; background: none; text-align: start; cursor: pointer; width: 100%; }
.sg:hover, .sg[aria-selected="true"] { background: var(--surface-2); }
.sg .thumb { width: 40px; aspect-ratio: 2/3; border-radius: 6px; overflow: hidden; background: var(--surface-2); }
.sg .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.sg b { display: block; font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sg small { display: block; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sg.all { grid-template-columns: 1fr; color: var(--accent); font-weight: 700; padding: 10px; border-top: 1px solid var(--line); border-radius: 0 0 10px 10px; margin-top: 4px; }
.people-row .person { width: 220px; flex: none; }
.search input:focus { border-color: var(--accent); }
.search > svg { position: absolute; inset-inline-start: 15px; top: 12px; width: 20px; height: 20px; color: var(--muted); pointer-events: none; }
.lang { display: flex; border: 1px solid var(--line); border-radius: 22px; padding: 3px; background: var(--surface); flex: none; }
.lang button { border: 0; background: none; border-radius: 18px; padding: 6px 12px; font-weight: 700; font-size: 13px; cursor: pointer; color: var(--muted); }
.lang button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.lang button:last-child { font-family: var(--font-he); }

/* ---------- content ---------- */
main { padding-bottom: 48px; }
.pad { padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }

.hero { position: relative; margin-inline: max(24px, env(safe-area-inset-left, 0px)); border-radius: 18px; overflow: hidden;
  min-height: 380px; display: flex; align-items: flex-end; background: var(--surface); isolation: isolate; }
.hero img.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; max-width: none; }
.hero::after { content: ""; position: absolute; inset: 0; z-index: -1;
  background: linear-gradient(to top, var(--bg) 2%, rgba(14,12,24,.75) 38%, rgba(14,12,24,.05) 75%),
              linear-gradient(to right, rgba(14,12,24,.85), transparent 65%); }
html[dir="rtl"] .hero::after { background: linear-gradient(to top, var(--bg) 2%, rgba(14,12,24,.75) 38%, rgba(14,12,24,.05) 75%),
              linear-gradient(to left, rgba(14,12,24,.85), transparent 65%); }
.hero-body { padding: 32px; max-width: 620px; display: grid; gap: 12px; }
.hero h1 { margin: 0; font-size: clamp(28px, 4.4vw, 48px); line-height: 1.05; letter-spacing: -.02em; text-wrap: balance; font-weight: 800; }
.hero p { margin: 0; color: #d6d3e8; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; max-width: 60ch; }
.hero-dots { position: absolute; bottom: 18px; inset-inline-end: 22px; display: flex; gap: 6px; }
.hero-dots button { width: 8px; height: 8px; border-radius: 4px; border: 0; padding: 0; background: rgba(255,255,255,.35); cursor: pointer; transition: width .25s; }
.hero-dots button[aria-current="true"] { width: 22px; background: var(--fg); }

.meta { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.imdb { display: inline-flex; align-items: center; gap: 5px; color: var(--fg); font-weight: 700; }
.imdb b { background: var(--gold); color: #1a1500; font-size: 10px; font-weight: 800; padding: 2px 4px; border-radius: 3px; letter-spacing: .02em; }
.chat { display: grid; gap: 18px; }
/* Discover: this-or-that */
.disc { display: grid; gap: 18px; }
.disc-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; }
.disc-top h2 { margin: 0; font-size: 22px; letter-spacing: -.01em; }
.disc-top .count { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.duel { display: grid; grid-template-columns: 1fr auto 1fr; gap: 14px; align-items: center; }
.duel .vs { color: var(--muted); font-weight: 800; font-size: 14px; letter-spacing: .08em; }
.pick { border: 0; padding: 0; background: none; cursor: pointer; text-align: start; display: grid; gap: 8px; min-width: 0; color: inherit; }
.pick .poster { width: 100%; max-width: 300px; justify-self: center; transition: transform .18s ease, box-shadow .18s ease, opacity .2s; }
.pick:hover .poster, .pick:focus-visible .poster { transform: translateY(-4px); box-shadow: 0 0 0 3px var(--accent), 0 16px 34px rgba(0,0,0,.5); }
.pick.won .poster { box-shadow: 0 0 0 3px var(--ok); transform: scale(1.03); }
.pick.lost .poster { opacity: .35; transform: scale(.96); }
.pick-info { max-width: 300px; justify-self: center; width: 100%; display: grid; gap: 3px; }
.pick-info b { font-size: 16px; line-height: 1.25; }
.pick-info small { color: var(--muted); font-size: 13px; }
.pick:focus-visible { outline: none; }
.disc-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.disc-hint { color: var(--muted); font-size: 12px; text-align: center; }
/* Ask AI fills the screen between the top bar and the menu; messages scroll, the message box stays at the bottom */
body.ai-mode { overflow: hidden; }
body.ai-mode main { position: fixed; z-index: 1; top: calc(var(--top-bar-h, 72px) + env(safe-area-inset-top, 0px)); bottom: 0; inset-inline: var(--rail) 0; display: flex; flex-direction: column; padding: 0; }
.ai-scroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding-block: 8px 20px; }
.ai-mode .composer { position: static; flex: none; background: var(--bg); border-top: 1px solid var(--line); padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px)); }
.ai-mode .composer form { max-width: none; }
.ai-mode .bubble { max-width: 85%; }
.ai-intro { display: grid; gap: 18px; padding-top: 12px; }
/* Speech bubbles, taken from the logo: the question is the dark bubble, the answer the bright one.
   Used only in Discover and Ask AI, so the shape stays the site's signature rather than decoration. */
.bubble { position: relative; max-width: 640px; padding: 12px 16px; border-radius: 20px; line-height: 1.55; overflow-wrap: anywhere; }
.bubble p { margin: 0; white-space: pre-wrap; }
.bubble.user { justify-self: end; }
.bubble.ai { justify-self: start; }
.bubble.q { --tail: #36268a; background: var(--tail); color: #fff; }
.bubble.a { --tail: #6347e4; background: linear-gradient(180deg, #8a6eff, var(--tail)); color: #fff; }
.bubble.wait, .bubble.err { --tail: var(--surface); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); color: var(--muted); }
.bubble.err { color: #ff9c9c; }
.bubble.ts { border-end-start-radius: 6px; }
.bubble.te { border-end-end-radius: 6px; }
.bubble.ts::after, .bubble.te::after { content: ""; position: absolute; bottom: -10px; width: 16px; height: 12px; background: var(--tail); }
.bubble.ts::after { inset-inline-start: 0; clip-path: polygon(0 0, 100% 0, 0 100%); }
.bubble.te::after { inset-inline-end: 0; clip-path: polygon(0 0, 100% 0, 100% 100%); }
html[dir="rtl"] .bubble.ts::after { clip-path: polygon(0 0, 100% 0, 100% 100%); }
html[dir="rtl"] .bubble.te::after { clip-path: polygon(0 0, 100% 0, 0 100%); }
.bubble.wide { max-width: 100%; display: grid; gap: 14px; padding: 14px 16px 16px; }
.bubble .grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
.bubble .card-title { color: #fff; }
.bubble .card-sub { color: rgba(255,255,255,.78); }
/* Discover start: the logo as a scene over a soft blur of posters */
.disc-stage { position: relative; overflow: hidden; border-radius: 24px; border: 1px solid var(--line); background: var(--surface);
  min-height: 420px; display: grid; align-content: center; padding: 40px 28px; }
.disc-collage { position: absolute; inset: -30px; display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 10px;
  filter: blur(4px) saturate(1.15); opacity: .55; transform: rotate(-5deg) scale(1.08); pointer-events: none; }
.disc-collage img { width: 100%; aspect-ratio: 2 / 3; object-fit: cover; border-radius: 10px; display: block; }
.disc-stage::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(14,12,24,.3), rgba(14,12,24,.82)); pointer-events: none; }
.disc-talk { position: relative; z-index: 1; display: grid; gap: 26px; width: 100%; max-width: 560px; margin-inline: auto; }
.say-q { justify-self: start; margin: 0; font-size: 24px; font-weight: 700; line-height: 1.3; padding: 16px 22px; }
.say-answers { justify-self: end; display: flex; flex-wrap: wrap; gap: 12px; }
.say-a { border: 0; font: inherit; font-size: 18px; font-weight: 700; padding: 14px 22px; cursor: pointer; display: inline-flex; align-items: center; gap: 10px;
  transition: transform .15s ease, filter .15s; }
.say-a svg { width: 18px; height: 18px; }
.say-a:hover { filter: brightness(1.1); transform: translateY(-2px); }
.disc-about { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.55; text-align: center; }
.disc-talk .btns { justify-self: center; }
.composer { position: sticky; bottom: 0; z-index: 5; padding-block: 14px calc(14px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(transparent, var(--bg) 30%); }
.composer form { display: flex; gap: 10px; align-items: flex-end; }
.composer textarea { flex: 1; min-width: 0; resize: none; min-height: 48px; max-height: 160px; border-radius: 24px; border: 1px solid var(--line);
  background: var(--surface); padding: 13px 18px; outline: none; line-height: 1.4; font: inherit; color: inherit; }
.composer textarea:focus { border-color: var(--accent); }
.composer .btn { height: 48px; flex: none; }
.examples { display: flex; flex-wrap: wrap; gap: 8px; }
.examples button { border: 1px solid var(--line); background: var(--surface); border-radius: 18px; padding: 9px 14px; cursor: pointer; text-align: start; font-size: 14px; }
.examples button:hover { border-color: var(--accent); }
.credits { display: grid; gap: 18px; margin-top: 8px; }
.seasons { display: grid; gap: 12px; justify-items: start; }
.seasons h2 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
.seasons table { border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; width: 100%; max-width: 620px;
  background: rgba(255,255,255,.03); border-radius: 12px; overflow: hidden; }
.seasons th, .seasons td { border: 1px solid rgba(255,255,255,.08); padding: 8px 10px; text-align: center; white-space: nowrap; }
.seasons th { background: rgba(255,255,255,.06); font-weight: 700; color: #e9e6f5; }
.seasons td { color: #dad7ea; }
.seasons td.ss-c { width: 14px; padding: 0; }
@media (max-width: 600px) { .seasons th, .seasons td { padding: 7px 5px; font-size: 13px; } .seasons th { white-space: normal; } }
.credits h2 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
.crew { display: grid; gap: 6px; }
.crew-row { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.crew-row dt { color: var(--muted); font-size: 13px; min-width: 84px; }
.crew-row dd { margin: 0; display: flex; flex-wrap: wrap; gap: 4px 12px; }
.name-link { border: 0; background: none; padding: 0; cursor: pointer; font-weight: 600; color: var(--fg); text-decoration: none; text-underline-offset: 3px; }
.name-link:hover { text-decoration: underline; }
.cast-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
.person { display: grid; grid-template-columns: 40px minmax(0, 1fr); align-items: center; gap: 10px; text-align: start; border: 1px solid var(--line);
  background: var(--surface); border-radius: 12px; padding: 8px 10px; cursor: pointer; min-width: 0; }
.person:hover { border-color: var(--accent); }
.face { width: 40px; height: 40px; border-radius: 50%; overflow: hidden; display: grid; place-items: center; background: var(--surface-2); color: var(--muted); flex: none; }
.face img { width: 100%; height: 100%; object-fit: cover; object-position: center 20%; display: block; }
.face svg { width: 60%; height: 60%; }
.person b { display: block; font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.person small { display: block; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.skeleton { height: 56px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
.person-head { display: flex; gap: 18px; align-items: center; margin-bottom: 22px; }
.person-head .face { width: 96px; height: 96px; box-shadow: 0 0 0 2px var(--line); }
.person-head h1 { margin: 0; font-size: clamp(26px, 4vw, 40px); letter-spacing: -.02em; }
.scores { display: flex; flex-wrap: wrap; gap: 10px; }
.score { display: grid; grid-template-columns: auto auto 1fr; align-items: center; column-gap: 8px; height: 44px; box-sizing: border-box;
  padding: 0 14px 0 6px; border-radius: 22px; background: var(--surface); border: 1px solid var(--line); text-decoration: none; }
html[dir="rtl"] .score { padding: 0 6px 0 14px; }
a.score:hover { border-color: var(--muted); }
.score .val { min-width: 38px; height: 32px; padding-inline: 6px; border-radius: 16px; display: grid; place-items: center;
  font-weight: 800; font-size: 15px; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.score .src { display: flex; align-items: center; }
.score .src svg { display: block; }
.score .verdict { font-size: 13px; font-weight: 700; white-space: nowrap; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.val.imdb-v { background: var(--gold); color: #1a1500; }
.val.fresh { background: #fa320a; color: #fff; }      /* Tomatometer 60%+ */
.val.rotten { background: #2f8f3a; color: #fff; }     /* below 60% */
.val.mc-hi { background: #00ce7a; color: #062b19; }   /* Metascore 61–100 */
.val.mc-mid { background: #ffbd3f; color: #2b1d00; }  /* 40–60 */
.val.mc-lo { background: #ff6874; color: #2b0006; }   /* 0–39 */
.mini { display: inline-flex; align-items: center; gap: 5px; font-weight: 700; color: var(--fg); font-variant-numeric: tabular-nums; }
.mini i { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }
.chip { border: 1px solid var(--line); border-radius: 12px; padding: 2px 9px; font-size: 12px; color: var(--fg); }

.btns { display: flex; flex-wrap: wrap; gap: 10px; position: relative; width: fit-content; }
.share-menu { position: absolute; top: calc(100% + 6px); inset-inline-end: 0; z-index: 5; display: grid; min-width: 190px; padding: 6px;
  border-radius: 14px; background: var(--surface-2); border: 1px solid var(--line); box-shadow: 0 14px 34px rgba(0,0,0,.45); }
.share-menu button { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 0; border-radius: 10px; background: none;
  color: var(--fg); font: inherit; font-weight: 600; cursor: pointer; text-align: start; }
.share-menu button:hover { background: var(--surface); }
.share-menu svg { width: 18px; height: 18px; flex: none; }
.share-menu [data-wa] svg { color: #1fa855; }
.btn:disabled, .btn.primary:disabled { background: var(--surface); border-color: var(--line); color: var(--muted); cursor: default; filter: none; }
.btn { height: 44px; padding-inline: 18px; border-radius: 22px; border: 1px solid var(--line); background: var(--surface-2);
  font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.on { border-color: var(--ok); color: var(--ok); }
.btn svg { width: 18px; height: 18px; }

.shelf { margin-top: 30px; }
.shelf-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.shelf-head h2 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
.shelf-head span { color: var(--muted); font-size: 13px; }
.row { display: flex; gap: 14px; overflow-x: auto; scroll-snap-type: x proximity; padding-block: 14px 22px; margin-block: -8px -10px;   /* room for the hover lift and glow, which a sideways-scrolling row would otherwise clip */

  // ---------- Where to watch in Israel (TMDB, data by JustWatch) ----------

        else await sb.from(table).delete().eq("user_id", user.id).eq("title_id", id);
      } catch (e) { toast(t("genericErr")); }
    } else store.set(table === "watchlist" ? "list" : "watched", [...(table === "watchlist" ? list : watched)]);
  }
  async function syncFromServer() {
    if (!user || !sb) return;
    try {
      // Move anything saved on this device before signing in into the account, once.
      const localList = store.get("list", []), localW = store.get("watched", []);
      if (localList.length) await sb.from("watchlist").upsert(localList.map(id => ({ user_id: user.id, title_id: id })), { ignoreDuplicates: true });
      if (localW.length) await sb.from("watched").upsert(localW.map(id => ({ user_id: user.id, title_id: id })), { ignoreDuplicates: true });
      store.set("list", []); store.set("watched", []);
      const [a, b, pr] = await Promise.all([
        sb.from("watchlist").select("title_id, added_at").order("added_at", { ascending: false }),
        sb.from("watched").select("title_id"),
        sb.from("profiles").select("services").eq("id", user.id).maybeSingle(),
      ]);
      list = new Set((a.data || []).map(r => r.title_id));
      watched = new Set((b.data || []).map(r => r.title_id));
      const sv = pr.data && pr.data.services;
      if (sv && sv.length) { myServices = new Set(sv.filter(p => PICK.includes(p))); store.set("services", sv); savedServices = [...sv].sort((a, b) => a - b).join(); }
      else if (myServices.size) { savedServices = null; saveServices(); }   // first sign-in on this device: keep what was picked here
      if (C) await ensureItems([...list, ...watched]);
      if (C) refresh();   // the language stays what this device shows (Hebrew unless English was picked here)
    } catch (e) { /* keep what's on screen */ }
  }
  function refresh() { if (!$("#detail").hidden) reopen(); else render(); }

  function renderAcct() {
    const w = $("#acct-wrap");
    if (!sb) { w.innerHTML = ""; return; }
    if (!user) { w.innerHTML = `<button class="btn acct" type="button" data-auth="in"><span>${t("signIn")}</span></button>`; return; }
    const email = user.email || "";
    w.innerHTML = `<button class="btn acct" type="button" id="acct-btn" aria-expanded="${menuOpen}"><span class="avatar">${esc(email[0] || "?")}</span><span class="label">${t("mylist")}</span></button>
      ${menuOpen ? `<div class="menu" role="menu"><div class="who">${esc(email)}</div>
        <button type="button" role="menuitem" data-view="list">${t("mylist")}</button>
        <button type="button" role="menuitem" id="sign-out">${t("signOut")}</button></div>` : ""}`;
  }
  function openAuth(mode) {
    authMode = mode; menuOpen = false;
    const up = mode === "up";
    $("#auth-title").textContent = up ? t("upTitle") : t("inTitle");
    $("#auth-sub").textContent = up ? t("upSub") : t("inSub");
    $("#auth-submit").textContent = up ? t("signUp") : t("signIn");
    $("#auth-alt-q").textContent = up ? t("haveAcct") : t("noAcct");
    $("#auth-switch").textContent = up ? t("signIn") : t("signUp");
    $("#auth-pass").autocomplete = up ? "new-password" : "current-password";
    $("#auth-msg").hidden = true;
    $("#auth").hidden = false; $("#auth-email").focus();
  }
  function authMsg(text, ok) { const m = $("#auth-msg"); m.textContent = text; m.className = "msg " + (ok ? "ok" : "err"); m.hidden = false; }
  $("#auth-form").addEventListener("submit", async e => {
    e.preventDefault();
    const email = $("#auth-email").value.trim(), password = $("#auth-pass").value;
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return authMsg(t("badEmail"));
    if (password.length < 6) return authMsg(t("shortPass"));
    const btn = $("#auth-submit"); btn.disabled = true;
    try {
      if (authMode === "up") {
        const { data, error } = await sb.auth.signUp({ email, password, options: { emailRedirectTo: location.origin + location.pathname } });
        if (error) throw error;
        if (data.session) { $("#auth").hidden = true; toast(t("welcome")); }
        else { authMsg(t("checkEmail"), true); authMode = "in"; $("#auth-submit").textContent = t("signIn"); }
      } else {
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) throw error;
        $("#auth").hidden = true; $("#auth-pass").value = ""; toast(t("welcome"));
      }
    } catch (err) {
      const m = String(err && err.message || "");
      authMsg(/invalid login|invalid credentials/i.test(m) ? t("badLogin") : /password/i.test(m) && /6/.test(m) ? t("shortPass") : (m || t("genericErr")));
    } finally { btn.disabled = false; }
  });
  $("#auth-switch").onclick = () => openAuth(authMode === "up" ? "in" : "up");
  $("#auth-cancel").onclick = () => { $("#auth").hidden = true; };
  $("#auth").addEventListener("click", e => { if (e.target.id === "auth") $("#auth").hidden = true; });
  document.addEventListener("click", async e => {
    const a = e.target.closest("[data-auth]"); if (a) { openAuth(a.dataset.auth); return; }
    if (e.target.closest("#acct-btn")) { menuOpen = !menuOpen; renderAcct(); return; }
    if (e.target.closest("#sign-out")) { menuOpen = false; await sb.auth.signOut(); toast(t("bye")); return; }
    if (menuOpen && !e.target.closest("#acct-wrap")) { menuOpen = false; renderAcct(); }
  });
  if (sb) sb.auth.onAuthStateChange((event, session) => {
    const was = user && user.id; user = session ? session.user : null;
    renderAcct();
    if (user && user.id !== was) { setTimeout(syncFromServer, 0); if (view === "discover" && disc.stage === "result" && !disc.result) setTimeout(discPicks, 0); }
    if (!user && was) { list = new Set(); watched = new Set(); if (C) refresh(); }
  });

  const topBar = document.querySelector(".top");
  const rail = document.querySelector(".rail");
  const setTopH = () => {
    document.documentElement.style.setProperty("--top-bar-h", topBar.offsetHeight + "px");
    const r = rail.getBoundingClientRect();   // on phones the menu is a bar along the bottom
    document.documentElement.style.setProperty("--nav-h", (r.top > innerHeight / 2 ? Math.max(0, innerHeight - r.top) : 0) + "px");
  };
  if ("ResizeObserver" in window) { const ro = new ResizeObserver(setTopH); ro.observe(topBar); ro.observe(rail); } setTopH();
  addEventListener("resize", setTopH);

  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) navigator.serviceWorker.register("sw.js").catch(() => {});

  setLang(lang);
  // First screen: home.json (rows + home titles). Then, in the background, index.json (6,000 popular titles for instant search).
  fetch("home.json?v=" + BUILD, { cache: "no-cache" }).then(r => r.json()).then(async data => {
    C = { ...data, index: [] }; render();
    const shared = new URLSearchParams(location.search).get("t");   // arrived from a shared /t/<id> link
    if (shared && /^[QMS]\d+$/.test(shared)) {   // Q: Wikidata titles; M/S: Israeli titles added from TMDB
      history.replaceState(null, "", location.pathname);
      await ensureItems([shared]);
      if (C.items[shared]) openDetail(shared);
    }
    if (user) { await ensureItems([...list, ...watched]); refresh(); }
    const idle = window.requestIdleCallback || (f => setTimeout(f, 300));
    idle(() => fetch("index.json?v=" + BUILD, { cache: "no-cache" }).then(r => r.json()).then(ix => {
      for (const [id, it] of Object.entries(ix.items)) if (!C.items[id]) C.items[id] = it;
      C.index = ix.ids.filter(id => C.items[id]);
      peopleIndex = null;
      if (view === "discover") render();
      const q = $("#q").value.trim(); if (q.length >= 2 && !$("#suggest").hidden) suggestNow(q);
    }).catch(() => {}));
  }).catch(() => { $("#main").innerHTML = `<div class="loading">The catalog didn’t load. Refresh the page to try again.</div>`; });
})();
</script>
</body>
</html>
