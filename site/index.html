<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0c18">
<title>What to Watch</title>
<link rel="preconnect" href="https://prnfnqvjirwuyafvsulk.supabase.co" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Rubik:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: media-center shell. Fixed icon rail (bottom bar on phones), sticky search bar,
   a featured hero, then horizontally scrolling poster shelves. Dark by design. */
:root {
  --bg: #0e0c18;          /* violet-tinted night */
  --surface: #181527;
  --surface-2: #231f37;
  --line: #2e2947;
  --fg: #eceaf6;
  --muted: #9a96b5;
  --accent: #8b6dff;      /* the one violet */
  --accent-ink: #ffffff;
  --gold: #f2c94c;        /* ratings */
  --ok: #4fd1a5;          /* watched */
  --font-ui: "Figtree", "Rubik", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-he: "Rubik", "Figtree", system-ui, "Segoe UI", "Arial Hebrew", sans-serif;
  --rail: 76px;
  --poster: 150px;
  color-scheme: dark;
}
html[lang="he"] { --font-ui: var(--font-he); }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); -webkit-text-size-adjust: 100%; }
body { margin: 0; }
img { max-width: 100%; }
html, body { background: var(--bg); color: var(--fg); }
body {
  font-family: var(--font-ui); font-size: 15px; line-height: 1.45;
  -webkit-font-smoothing: antialiased; overflow-x: hidden;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

/* ---------- rail ---------- */
.rail {
  position: fixed; inset-block: 0; inset-inline-start: 0; width: var(--rail); z-index: 20;
  background: var(--surface); border-inline-end: 1px solid var(--line);
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  padding-block: calc(14px + env(safe-area-inset-top, 0px)) 14px;
}
.brand { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center;
  background: var(--accent); color: var(--accent-ink); font-weight: 800; font-size: 15px; margin-block-end: 14px; letter-spacing: -.02em; }
.nav-btn { width: 60px; padding-block: 9px 7px; border: 0; background: none; border-radius: 12px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--muted); font-size: 11px; font-weight: 600; }
.nav-btn svg { width: 22px; height: 22px; }
.nav-btn:hover { color: var(--fg); background: var(--surface-2); }
.nav-btn[aria-current="page"] { color: var(--fg); background: var(--surface-2); }
.nav-btn[aria-current="page"] svg { color: var(--accent); }

/* ---------- top bar ---------- */
.app { margin-inline-start: var(--rail); min-width: 0; }
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 15;
  display: flex; align-items: center; gap: 14px;
  padding-block: 14px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px));
  background: linear-gradient(var(--bg) 60%, transparent);
}
.wordmark { font-weight: 800; font-size: 19px; letter-spacing: -.02em; white-space: nowrap; }
.wordmark span { color: var(--accent); }
.search { flex: 1; max-width: 560px; margin-inline: auto; position: relative; min-width: 0; }
.search input { width: 100%; height: 44px; border-radius: 22px; border: 1px solid var(--line); background: var(--surface);
  padding-inline: 44px 16px; outline: none; }
.search input::placeholder { color: var(--muted); }
.suggest { position: absolute; top: calc(100% + 6px); inset-inline: 0; z-index: 25; background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
  box-shadow: 0 18px 44px rgba(0,0,0,.55); padding: 6px; display: grid; gap: 2px; max-height: min(70vh, 560px); overflow-y: auto; }
.suggest h3 { margin: 6px 10px 2px; font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
html[lang="he"] .suggest h3 { letter-spacing: 0; }
.sg { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 12px; align-items: center; padding: 6px 8px; border-radius: 10px; border: 0; background: none; text-align: start; cursor: pointer; width: 100%; }
.sg:hover, .sg[aria-selected="true"] { background: var(--surface-2); }
.sg .thumb { width: 40px; aspect-ratio: 2/3; border-radius: 6px; overflow: hidden; background: var(--surface-2); }
.sg .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.sg b { display: block; font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sg small { display: block; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sg.all { grid-template-columns: 1fr; color: var(--accent); font-weight: 700; padding: 10px; border-top: 1px solid var(--line); border-radius: 0 0 10px 10px; margin-top: 4px; }
.people-row .person { width: 220px; flex: none; }
.search input:focus { border-color: var(--accent); }
.search svg { position: absolute; inset-inline-start: 15px; top: 12px; width: 20px; height: 20px; color: var(--muted); pointer-events: none; }
.lang { display: flex; border: 1px solid var(--line); border-radius: 22px; padding: 3px; background: var(--surface); flex: none; }
.lang button { border: 0; background: none; border-radius: 18px; padding: 6px 12px; font-weight: 700; font-size: 13px; cursor: pointer; color: var(--muted); }
.lang button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.lang button:last-child { font-family: var(--font-he); }

/* ---------- content ---------- */
main { padding-bottom: 48px; }
.pad { padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }

.hero { position: relative; margin-inline: max(24px, env(safe-area-inset-left, 0px)); border-radius: 18px; overflow: hidden;
  min-height: 380px; display: flex; align-items: flex-end; background: var(--surface); isolation: isolate; }
.hero img.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; max-width: none; }
.hero::after { content: ""; position: absolute; inset: 0; z-index: -1;
  background: linear-gradient(to top, var(--bg) 2%, rgba(14,12,24,.75) 38%, rgba(14,12,24,.05) 75%),
              linear-gradient(to right, rgba(14,12,24,.85), transparent 65%); }
html[dir="rtl"] .hero::after { background: linear-gradient(to top, var(--bg) 2%, rgba(14,12,24,.75) 38%, rgba(14,12,24,.05) 75%),
              linear-gradient(to left, rgba(14,12,24,.85), transparent 65%); }
.hero-body { padding: 32px; max-width: 620px; display: grid; gap: 12px; }
.hero h1 { margin: 0; font-size: clamp(28px, 4.4vw, 48px); line-height: 1.05; letter-spacing: -.02em; text-wrap: balance; font-weight: 800; }
.hero p { margin: 0; color: #d6d3e8; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; max-width: 60ch; }
.hero-dots { position: absolute; bottom: 18px; inset-inline-end: 22px; display: flex; gap: 6px; }
.hero-dots button { width: 8px; height: 8px; border-radius: 4px; border: 0; padding: 0; background: rgba(255,255,255,.35); cursor: pointer; transition: width .25s; }
.hero-dots button[aria-current="true"] { width: 22px; background: var(--fg); }

.meta { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.imdb { display: inline-flex; align-items: center; gap: 5px; color: var(--fg); font-weight: 700; }
.imdb b { background: var(--gold); color: #1a1500; font-size: 10px; font-weight: 800; padding: 2px 4px; border-radius: 3px; letter-spacing: .02em; }
.chat { display: grid; gap: 18px; }
/* Ask AI fills the screen between the top bar and the menu; messages scroll, the message box stays at the bottom */
body.ai-mode { overflow: hidden; }
body.ai-mode main { position: fixed; z-index: 1; top: var(--top-h, 72px); bottom: 0; inset-inline: var(--rail) 0; display: flex; flex-direction: column; padding: 0; }
.ai-scroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding-block: 8px 20px; }
.ai-mode .composer { position: static; flex: none; background: var(--bg); border-top: 1px solid var(--line); padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px)); }
.ai-mode .composer form { max-width: none; }
.ai-mode .bubble { max-width: min(760px, 85%); }
.ai-intro { display: grid; gap: 18px; padding-top: 12px; max-width: 760px; }
.bubble { max-width: 640px; padding: 12px 16px; border-radius: 18px; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; }
.bubble.user { justify-self: end; background: var(--accent); color: var(--accent-ink); border-end-end-radius: 6px; }
.bubble.ai { justify-self: start; background: var(--surface); border: 1px solid var(--line); border-end-start-radius: 6px; }
.bubble.wait { color: var(--muted); }
.bubble.err { color: #ff9c9c; }
.ai-turn { display: grid; gap: 12px; }
.ai-turn .grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
.composer { position: sticky; bottom: 0; z-index: 5; padding-block: 14px calc(14px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(transparent, var(--bg) 30%); }
.composer form { display: flex; gap: 10px; align-items: flex-end; }
.composer textarea { flex: 1; min-width: 0; resize: none; min-height: 48px; max-height: 160px; border-radius: 24px; border: 1px solid var(--line);
  background: var(--surface); padding: 13px 18px; outline: none; line-height: 1.4; font: inherit; color: inherit; }
.composer textarea:focus { border-color: var(--accent); }
.composer .btn { height: 48px; flex: none; }
.examples { display: flex; flex-wrap: wrap; gap: 8px; }
.examples button { border: 1px solid var(--line); background: var(--surface); border-radius: 18px; padding: 9px 14px; cursor: pointer; text-align: start; font-size: 14px; }
.examples button:hover { border-color: var(--accent); }
.credits { display: grid; gap: 18px; margin-top: 8px; }
.credits h2 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
.crew { display: grid; gap: 6px; }
.crew-row { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.crew-row dt { color: var(--muted); font-size: 13px; min-width: 84px; }
.crew-row dd { margin: 0; display: flex; flex-wrap: wrap; gap: 4px 12px; }
.name-link { border: 0; background: none; padding: 0; cursor: pointer; font-weight: 600; color: var(--fg); text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
.name-link:hover { text-decoration-color: var(--accent); color: var(--accent); }
.cast-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
.person { display: grid; grid-template-columns: 40px minmax(0, 1fr); align-items: center; gap: 10px; text-align: start; border: 1px solid var(--line);
  background: var(--surface); border-radius: 12px; padding: 8px 10px; cursor: pointer; min-width: 0; }
.person:hover { border-color: var(--accent); }
.face { width: 40px; height: 40px; border-radius: 50%; overflow: hidden; display: grid; place-items: center; background: var(--surface-2); color: var(--muted); flex: none; }
.face img { width: 100%; height: 100%; object-fit: cover; object-position: center 20%; display: block; }
.face svg { width: 60%; height: 60%; }
.person b { display: block; font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.person small { display: block; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.skeleton { height: 56px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
.person-head { display: flex; gap: 18px; align-items: center; margin-bottom: 22px; }
.person-head .face { width: 96px; height: 96px; box-shadow: 0 0 0 2px var(--line); }
.person-head h1 { margin: 0; font-size: clamp(26px, 4vw, 40px); letter-spacing: -.02em; }
.scores { display: flex; flex-wrap: wrap; gap: 10px; }
.score { display: grid; grid-template-columns: auto 1fr; align-items: center; column-gap: 12px; row-gap: 1px; min-width: 150px;
  padding: 10px 14px 10px 10px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); text-decoration: none; }
html[dir="rtl"] .score { padding: 10px 10px 10px 14px; }
a.score:hover { border-color: var(--muted); }
.score .val { grid-row: span 2; min-width: 48px; height: 48px; padding-inline: 6px; border-radius: 10px; display: grid; place-items: center;
  font-weight: 800; font-size: 19px; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.score .src { font-size: 12px; color: var(--muted); font-weight: 600; }
.score .verdict { font-size: 14px; font-weight: 700; }
.val.imdb-v { background: var(--gold); color: #1a1500; }
.val.fresh { background: #fa320a; color: #fff; }      /* Tomatometer 60%+ */
.val.rotten { background: #2f8f3a; color: #fff; }     /* below 60% */
.val.mc-hi { background: #00ce7a; color: #062b19; }   /* Metascore 61–100 */
.val.mc-mid { background: #ffbd3f; color: #2b1d00; }  /* 40–60 */
.val.mc-lo { background: #ff6874; color: #2b0006; }   /* 0–39 */
.mini { display: inline-flex; align-items: center; gap: 5px; font-weight: 700; color: var(--fg); font-variant-numeric: tabular-nums; }
.mini i { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }
.chip { border: 1px solid var(--line); border-radius: 12px; padding: 2px 9px; font-size: 12px; color: var(--fg); }

.btns { display: flex; flex-wrap: wrap; gap: 10px; }
.btn { height: 44px; padding-inline: 18px; border-radius: 22px; border: 1px solid var(--line); background: var(--surface-2);
  font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.on { border-color: var(--ok); color: var(--ok); }
.btn svg { width: 18px; height: 18px; }

.shelf { margin-top: 30px; }
.shelf-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.shelf-head h2 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
.shelf-head span { color: var(--muted); font-size: 13px; }
.row { display: flex; gap: 14px; overflow-x: auto; scroll-snap-type: x proximity; padding-block: 14px 22px; margin-block: -8px -10px;   /* room for the hover lift and glow, which a sideways-scrolling row would otherwise clip */
  padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px));
  scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.row::-webkit-scrollbar { height: 6px; } .row::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }

.card { flex: none; width: var(--poster); scroll-snap-align: start; border: 0; padding: 0; background: none; text-align: start; cursor: pointer; display: grid; gap: 8px; }
.poster { position: relative; aspect-ratio: 2/3; width: 100%; max-width: 100%; border-radius: 12px; overflow: hidden; background: var(--surface-2);
  box-shadow: 0 0 0 1px var(--line); transition: transform .2s ease, box-shadow .2s ease; }
.poster img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card:hover .poster, .card:focus-visible .poster { transform: translateY(-4px) scale(1.03); box-shadow: 0 0 0 2px var(--accent), 0 14px 30px rgba(0,0,0,.45); }
.card:focus-visible { outline: none; }
.badge { position: absolute; top: 7px; inset-inline-start: 7px; background: rgba(14,12,24,.82); backdrop-filter: blur(4px);
  border-radius: 8px; padding: 2px 7px; font-size: 12px; font-weight: 700; display: inline-flex; gap: 4px; align-items: center; font-variant-numeric: tabular-nums; }
.badge i { color: var(--gold); font-style: normal; }
.mark { position: absolute; top: 7px; inset-inline-end: 7px; width: 24px; height: 24px; border-radius: 12px; display: grid; place-items: center;
  background: var(--ok); color: #062a1f; }
.mark svg { width: 14px; height: 14px; }
.card-title { font-size: 14px; font-weight: 600; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card-sub { font-size: 12px; color: var(--muted); margin-top: -4px; }
.textcard { position: absolute; inset: 0; display: grid; align-content: end; padding: 12px; gap: 4px;
  background: linear-gradient(160deg, var(--surface-2), var(--surface)); }
.textcard strong { font-size: 15px; line-height: 1.2; }
.textcard small { color: var(--muted); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 22px 16px; }
.card.more .poster { display: grid; place-items: center; align-content: center; gap: 10px; background: var(--surface); box-shadow: 0 0 0 1px var(--line); color: var(--fg); font-weight: 700; }
.card.more .poster svg { width: 34px; height: 34px; padding: 7px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); }
html[dir="rtl"] .card.more .poster svg { transform: scaleX(-1); }
.browse-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 20px; margin: 8px 0 22px; }
.browse-head .view-head { margin: 0; }
.sort { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding-inline: 14px 10px; border: 1px solid var(--line); border-radius: 20px; background: var(--surface); }
.sort label { color: var(--muted); font-size: 13px; font-weight: 600; }
.sort select { border: 0; background: transparent; color: var(--fg); font: inherit; font-weight: 700; outline: none; cursor: pointer; padding-inline-end: 4px; }
.sort select option { background: var(--surface); color: var(--fg); }
.sort:focus-within { border-color: var(--accent); }
.list-foot { display: grid; place-items: center; padding-block: 28px 8px; color: var(--muted); }
.back-row { margin-bottom: 14px; }
.detail-inner .row { padding-left: 0; padding-right: 0; }
.detail-inner .shelf-head { padding: 0; }
.detail-inner .shelf:first-of-type { margin-top: 8px; }
.grid .card { width: auto; }
.view-head { margin: 8px 0 20px; display: grid; gap: 4px; }
.view-head h1 { margin: 0; font-size: 28px; letter-spacing: -.02em; }
.view-head p { margin: 0; color: var(--muted); max-width: 60ch; }
.empty { border: 1px dashed var(--line); border-radius: 16px; padding: 28px; color: var(--muted); max-width: 520px; display: grid; gap: 8px; }
.empty strong { color: var(--fg); font-size: 16px; }

/* ---------- detail ---------- */
.detail { position: fixed; inset: 0; z-index: 40; overflow-y: auto; background: var(--bg); }
.detail-bg { position: absolute; inset: 0 0 auto; height: 520px; overflow: hidden; z-index: 0; }
.detail-bg img { width: 100%; height: 100%; object-fit: cover; filter: blur(28px) saturate(1.2); opacity: .45; transform: scale(1.15); max-width: none; }
.detail-bg img.sharp { filter: none; opacity: .5; transform: none; }
.detail-bg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(14,12,24,.2), var(--bg) 92%); }
.detail-inner { position: relative; z-index: 1; max-width: 1080px; margin-inline: auto;
  padding-block: calc(20px + env(safe-area-inset-top, 0px)) 60px;
  padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
.back { margin-bottom: 26px; }
.detail-grid { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 36px; align-items: start; }
.detail-grid .poster { box-shadow: 0 20px 50px rgba(0,0,0,.5), 0 0 0 1px var(--line); }
.detail-text { display: grid; gap: 14px; min-width: 0; }
.detail h1 { margin: 0; font-size: clamp(28px, 4vw, 44px); line-height: 1.08; letter-spacing: -.02em; text-wrap: balance; }
.alt-title { color: var(--muted); font-size: 16px; margin-top: -8px; }
.overview { margin: 0; font-size: 16px; line-height: 1.6; max-width: 64ch; color: #dad7ea; }
.links { display: flex; flex-wrap: wrap; gap: 8px; }
.links a { font-size: 13px; font-weight: 600; text-decoration: none; border: 1px solid var(--line); border-radius: 16px; padding: 6px 12px; display: inline-flex; gap: 6px; align-items: center; }
.links a:hover { border-color: var(--accent); }
.links svg { width: 13px; height: 13px; opacity: .7; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; padding: 16px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); max-width: 640px; }
.facts div { display: grid; gap: 2px; }
.facts dt { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
html[lang="he"] .facts dt { letter-spacing: 0; }
.facts dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; }

.rail-about { margin-top: auto; }
.about-btn { display: none; width: 40px; height: 40px; flex: none; border-radius: 20px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); cursor: pointer; place-items: center; padding: 0; }
.about-btn svg { width: 20px; height: 20px; }
.about-btn[aria-current="page"] { color: var(--accent); border-color: var(--accent); }
.faq { display: grid; gap: 10px; max-width: 760px; }
.faq details { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.faq details[open] { border-color: var(--muted); }

  let searchQ = "", qT, sgSeq = 0, sgItems = [], sgIndex = -1;
  function clearSearch() { searchQ = ""; $("#q").value = ""; hideSuggest(); }
  function hideSuggest() { const b = $("#suggest"); b.hidden = true; b.innerHTML = ""; $("#q").setAttribute("aria-expanded", "false"); sgItems = []; sgIndex = -1; }
  function runSearch(q) {
    q = (q || "").trim(); hideSuggest(); $("#q").blur();
    searchQ = q; if (!$("#detail").hidden) closeDetail(); else render(); window.scrollTo(0, 0);
  }
  async function suggest(q) {
    const seq = ++sgSeq;
    if (!sb || q.length < 2) { hideSuggest(); return; }
    const [tr, pr] = await Promise.all([
      sb.rpc("search_titles", { q, lim: 25 }).then(r => r, () => ({ data: [] })),
      sb.rpc("search_people", { q, lim: 10 }).then(r => r, () => ({ data: [] })),
    ]);
    if (seq !== sgSeq || $("#q").value.trim() !== q) return;
    // What you typed matching the start of a name ranks first; the database's popularity order breaks ties
    const nq = norm(q);
    const rank = names => { const ns = names.map(norm).filter(Boolean);
      return ns.some(n => n === nq) ? 0 : ns.some(n => n.startsWith(nq)) ? 1 : ns.some(n => n.split(" ").some(w => w.startsWith(nq))) ? 2 : 3; };
    const byRank = (list, names) => list.map((x, i) => [rank(names(x)), i, x]).sort((a, b) => a[0] - b[0] || a[1] - b[1]).map(r => r[2]);
    const titles = tr.error ? [] : byRank(tr.data || [], r => [r.title, r.title_he, r.original_title]).slice(0, 5);
    // People: any word starting with what you typed counts equally, then the most popular first
    const wordHit = p => [p.name, p.name_he].map(norm).some(n => n && n.split(" ").some(w => w.startsWith(nq.split(" ")[0])) && n.includes(nq)) ? 0 : 1;
    const people = pr.error ? [] : (pr.data || []).map((p, i) => [wordHit(p), i, p]).sort((a, b) => a[0] - b[0] || a[1] - b[1]).map(r => r[2]).slice(0, 3);
    titles.forEach(r => { if (!C.items[r.id] || !C.items[r.id].p) C.items[r.id] = fromRow(r); });
    sgItems = [...titles.map(r => ({ k: "t", id: r.id })), ...people.map(p => ({ k: "p", id: p.id })), { k: "all" }];
    sgIndex = -1;
    const tHtml = titles.map((r, i) => { const it = C.items[r.id], ps = poster(it);
      return `<button class="sg" type="button" role="option" data-sg="${i}"><span class="thumb">${ps ? `<img src="${ps.replace("/w500/", "/w92/")}" alt="">` : ""}</span>
        <span><b>${esc(title(it))}</b><small>${years(it)} · ${it.ty === "tv" ? t("tv") : t("movie")}${altTitle(it) ? " · " + esc(altTitle(it)) : ""}</small></span></button>`; }).join("");
    const pHtml = people.map((p, j) => `<button class="sg" type="button" role="option" data-sg="${titles.length + j}">${face(p.photo)}
        <span><b>${esc(pname(p))}</b><small>${esc(knownFor(p))}</small></span></button>`).join("");
    const box = $("#suggest");
    box.innerHTML = (titles.length ? `<h3>${t("sgTitles")}</h3>${tHtml}` : "") + (people.length ? `<h3>${t("sgPeople")}</h3>${pHtml}` : "")
      + `<button class="sg all" type="button" role="option" data-sg="${sgItems.length - 1}">${esc(t("sgAll")(q))}</button>`;

        <textarea id="ai-input" rows="1" placeholder="${esc(t("aiPh"))}" ${signedOut || aiBusy ? "disabled" : ""}></textarea>
        <button class="btn primary" type="submit" ${signedOut || aiBusy ? "disabled" : ""}>${t("aiSend")}</button>
        ${aiMsgs.length && !aiBusy ? `<button class="btn" type="button" id="ai-new">${t("aiNew")}</button>` : ""}
      </form></div>`}`;
  }
  function autoGrow(ta) { ta.style.height = "auto"; ta.style.height = Math.min(ta.scrollHeight, 160) + "px"; }
  async function askAI(text) {
    text = (text || "").trim(); if (!text || aiBusy) return;
    if (!user) { openAuth("in"); return; }
    aiMsgs.push({ role: "user", content: text }); aiDraft = ""; aiBusy = true; render();
    let reply;
    try {
      const { data } = await sb.auth.getSession();
      const r = await fetch("api/ask", { method: "POST", headers: { "Content-Type": "application/json", Authorization: `Bearer ${data.session ? data.session.access_token : ""}` },
        body: JSON.stringify({ lang, messages: aiMsgs.filter(m => !m.err).map(m => ({ role: m.role, content: m.role === "assistant" ? (m.content + (m.ids && m.ids.length ? "\n[Recommended: " + m.ids.map(id => C.items[id] ? C.items[id].t : id).join(", ") + "]" : "")) : m.content })) }) });
      const j = await r.json().catch(() => ({}));
      if (r.ok) { await ensureItems(j.ids || []); reply = { role: "assistant", content: j.message || "", ids: j.ids || [] }; }
      else reply = { role: "assistant", err: true, content: j.error === "limit" ? t("aiLimit") : j.error === "not_configured" ? t("aiNotReady") : j.error === "sign_in" ? t("aiSignIn") : t("aiErr") };
    } catch (e) { reply = { role: "assistant", err: true, content: t("aiErr") }; }
    aiMsgs.push(reply); aiBusy = false;
    if (view === "ai" && !searchQ) render();
  }
  document.addEventListener("submit", e => { if (e.target.id === "ai-form") { e.preventDefault(); askAI($("#ai-input").value); } });
  document.addEventListener("input", e => { if (e.target.id === "ai-input") { aiDraft = e.target.value; autoGrow(e.target); } });
  document.addEventListener("keydown", e => { if (e.target.id === "ai-input" && e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); askAI(e.target.value); } });
  document.addEventListener("click", e => {
    const a = e.target.closest("[data-ask]"); if (a) { askAI(a.dataset.ask); return; }
    if (e.target.closest("#ai-new")) { aiMsgs = []; render(); }
  });

  async function saveMark(table, id, on) {
    if (user && sb) {
      try {
        if (on) await sb.from(table).upsert({ user_id: user.id, title_id: id });
        else await sb.from(table).delete().eq("user_id", user.id).eq("title_id", id);
      } catch (e) { toast(t("genericErr")); }
    } else store.set(table === "watchlist" ? "list" : "watched", [...(table === "watchlist" ? list : watched)]);
  }
  async function syncFromServer() {
    if (!user || !sb) return;
    try {
      // Move anything saved on this device before signing in into the account, once.
      const localList = store.get("list", []), localW = store.get("watched", []);
      if (localList.length) await sb.from("watchlist").upsert(localList.map(id => ({ user_id: user.id, title_id: id })), { ignoreDuplicates: true });
      if (localW.length) await sb.from("watched").upsert(localW.map(id => ({ user_id: user.id, title_id: id })), { ignoreDuplicates: true });
      store.set("list", []); store.set("watched", []);
      const [a, b, pr] = await Promise.all([
        sb.from("watchlist").select("title_id, added_at").order("added_at", { ascending: false }),
        sb.from("watched").select("title_id"),
        sb.from("profiles").select("lang").eq("id", user.id).maybeSingle(),
      ]);
      list = new Set((a.data || []).map(r => r.title_id));
      watched = new Set((b.data || []).map(r => r.title_id));
      if (C) await ensureItems([...list, ...watched]);
      if (pr.data && pr.data.lang && pr.data.lang !== lang) setLang(pr.data.lang); else if (C) refresh();
    } catch (e) { /* keep what's on screen */ }
  }
  function refresh() { if (!$("#detail").hidden) reopen(); else render(); }

  function renderAcct() {
    const w = $("#acct-wrap");
    if (!sb) { w.innerHTML = ""; return; }
    if (!user) { w.innerHTML = `<button class="btn acct" type="button" data-auth="in"><span>${t("signIn")}</span></button>`; return; }
    const email = user.email || "";
    w.innerHTML = `<button class="btn acct" type="button" id="acct-btn" aria-expanded="${menuOpen}"><span class="avatar">${esc(email[0] || "?")}</span><span class="label">${t("mylist")}</span></button>
      ${menuOpen ? `<div class="menu" role="menu"><div class="who">${esc(email)}</div>
        <button type="button" role="menuitem" data-view="list">${t("mylist")}</button>
        <button type="button" role="menuitem" id="sign-out">${t("signOut")}</button></div>` : ""}`;
  }
  function openAuth(mode) {
    authMode = mode; menuOpen = false;
    const up = mode === "up";
    $("#auth-title").textContent = up ? t("upTitle") : t("inTitle");
    $("#auth-sub").textContent = up ? t("upSub") : t("inSub");
    $("#auth-submit").textContent = up ? t("signUp") : t("signIn");
    $("#auth-alt-q").textContent = up ? t("haveAcct") : t("noAcct");
    $("#auth-switch").textContent = up ? t("signIn") : t("signUp");
    $("#auth-pass").autocomplete = up ? "new-password" : "current-password";
    $("#auth-msg").hidden = true;
    $("#auth").hidden = false; $("#auth-email").focus();
  }
  function authMsg(text, ok) { const m = $("#auth-msg"); m.textContent = text; m.className = "msg " + (ok ? "ok" : "err"); m.hidden = false; }
  $("#auth-form").addEventListener("submit", async e => {
    e.preventDefault();
    const email = $("#auth-email").value.trim(), password = $("#auth-pass").value;
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return authMsg(t("badEmail"));
    if (password.length < 6) return authMsg(t("shortPass"));
    const btn = $("#auth-submit"); btn.disabled = true;
    try {
      if (authMode === "up") {
        const { data, error } = await sb.auth.signUp({ email, password, options: { emailRedirectTo: location.origin + location.pathname } });
        if (error) throw error;
        if (data.session) { $("#auth").hidden = true; toast(t("welcome")); }
        else { authMsg(t("checkEmail"), true); authMode = "in"; $("#auth-submit").textContent = t("signIn"); }
      } else {
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) throw error;
        $("#auth").hidden = true; $("#auth-pass").value = ""; toast(t("welcome"));
      }
    } catch (err) {
      const m = String(err && err.message || "");
      authMsg(/invalid login|invalid credentials/i.test(m) ? t("badLogin") : /password/i.test(m) && /6/.test(m) ? t("shortPass") : (m || t("genericErr")));
    } finally { btn.disabled = false; }
  });
  $("#auth-switch").onclick = () => openAuth(authMode === "up" ? "in" : "up");
  $("#auth-cancel").onclick = () => { $("#auth").hidden = true; };
  $("#auth").addEventListener("click", e => { if (e.target.id === "auth") $("#auth").hidden = true; });
  document.addEventListener("click", async e => {
    const a = e.target.closest("[data-auth]"); if (a) { openAuth(a.dataset.auth); return; }
    if (e.target.closest("#acct-btn")) { menuOpen = !menuOpen; renderAcct(); return; }
    if (e.target.closest("#sign-out")) { menuOpen = false; await sb.auth.signOut(); toast(t("bye")); return; }
    if (menuOpen && !e.target.closest("#acct-wrap")) { menuOpen = false; renderAcct(); }
  });
  if (sb) sb.auth.onAuthStateChange((event, session) => {
    const was = user && user.id; user = session ? session.user : null;
    renderAcct();
    if (user && user.id !== was) setTimeout(syncFromServer, 0);
    if (!user && was) { list = new Set(); watched = new Set(); if (C) refresh(); }
  });

  const topBar = document.querySelector(".top");
  const rail = document.querySelector(".rail");
  const setTopH = () => {
    document.documentElement.style.setProperty("--top-h", topBar.getBoundingClientRect().bottom + "px");
    const r = rail.getBoundingClientRect();   // on phones the menu is a bar along the bottom
    document.documentElement.style.setProperty("--nav-h", (r.top > innerHeight / 2 ? Math.max(0, innerHeight - r.top) : 0) + "px");
  };
  if ("ResizeObserver" in window) { const ro = new ResizeObserver(setTopH); ro.observe(topBar); ro.observe(rail); } setTopH();
  addEventListener("resize", setTopH);

  setLang(lang);
  fetch("catalog.json?v=" + BUILD, { cache: "no-cache" }).then(r => r.json()).then(async data => { C = data; render(); if (user) { await ensureItems([...list, ...watched]); refresh(); } })
    .catch(() => { $("#main").innerHTML = `<div class="loading">The catalog didn’t load. Refresh the page to try again.</div>`; });
})();
</script>
</body>
</html>
